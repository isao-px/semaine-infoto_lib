[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "semaine_infoto"
dynamic = ["version"]
description = "Bibliothèque MicroPython pour ESP32 : servo, LED, potentiomètre, photorésistance, bouton et temps de pose."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isao Perregaux" }]
# Version de Python sur le PC qui télécharge le paquet ; le code, lui, tourne sous MicroPython.
requires-python = ">=3.8"
# `machine` et `time` sont intégrés au firmware MicroPython : aucune dépendance PyPI.
dependencies = []
keywords = ["micropython", "esp32", "arduino", "photographie", "servo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Natural Language :: French",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: System :: Hardware",
]

[project.urls]
Repository = "https://github.com/stefanlauper326-cyber/Semain-info"

# Lu comme du texte : le module n'est pas importé (il échouerait sans `machine`).
[tool.hatch.version]
path = "src/semaine_infoto/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/semaine_infoto"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "package.json"]
